<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate your FLAMES connection and discover your romantic compatibility.">
    <title>FLAMES - Find Your Connection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="title">F<span class="highlight">L</span>A<span class="highlight">M</span>E<span class="highlight">S</span></h1>
            <p class="subtitle">Discover the true connection between two names</p>
            
            <div class="input-group">
                <label for="name1">Your Name</label>
                <input type="text" id="name1" placeholder="Enter first name" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="name2">Their Name</label>
                <input type="text" id="name2" placeholder="Enter second name" autocomplete="off">
            </div>
            
            <button id="calculate-btn">Reveal Connection</button>
            
            <div id="result-container" class="hidden">
                <h2 id="result-text"></h2>
                <div id="result-desc"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
